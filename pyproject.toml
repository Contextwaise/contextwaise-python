[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "contextwaise"
dynamic = ["version"]
description = "Shrink agent tool results at birth: cache-safe, reversible, intent-aware."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["llm", "agents", "tool-calling", "context-window", "prompt-caching", "tokens"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27,<1"]

[project.urls]
Homepage = "https://contextwaise.com"
Documentation = "https://contextwaise.com/docs/sdk"
Repository = "https://github.com/Contextwaise/contextwaise-python"
Issues = "https://github.com/Contextwaise/contextwaise-python/issues"

[project.optional-dependencies]
# The Vercel AI SDK for Python adapter (contextwaise.ai_sdk). The `ai` package needs Python 3.12+.
ai = ["ai>=0.8; python_version >= '3.12'"]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.22", "ruff>=0.6", "mypy>=1.11", "ai>=0.8; python_version >= '3.12'"]

[tool.hatch.version]
path = "src/contextwaise/_version.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
xfail_strict = true

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "PIE", "PT", "PERF", "RUF"]
# RUF001: tool output is full of "×", "✓" and "…" on purpose.
# SIM905: a word list reads better as one string.
ignore = ["RUF001", "SIM905"]

[tool.mypy]
strict = true
files = ["src", "tests"]
